# Docker Compose Override for Development
# This file extends docker-compose.yml with development-specific configurations


services:
  wifi-hotspot:
    # Build with cache for faster rebuilds
    build:
      cache_from:
        - ubuntu:20.04
      
    # Development volumes for easier editing
    volumes:
      - ./docker/config:/etc/wifi-hotspot-config:ro
      - ./docker/custom:/etc/custom-config:ro
      - ./hotspot-login:/var/www/hotspot.example.com/hotspot-login
      
    # Environment variables for development
    environment:
      - DEBUG=1
      - LOG_LEVEL=debug
    
    # NOTE: ports are not used in host network mode (network_mode: host is set in docker-compose.yml)
    # Uncomment and switch to bridge mode if port mapping is needed:
    # ports:
    #   - "8080:80"
    #   - "8443:443"
    #   - "3990:3990"
    #   - "4990:4990"
    #   - "1812:1812"
    #   - "1813:1813"
    
    # Health check
    healthcheck:
      test: ["CMD", "pgrep", "-x", "chilli"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Development database container (optional, for easier PostgreSQL management)
  postgres-dev:
    image: postgres:17
    container_name: postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: radius
      POSTGRES_USER: freerad
      POSTGRES_PASSWORD: radtesting123
    ports:
      - "5432:5432"
    volumes:
      - ./docker/data/postgres-dev:/var/lib/postgresql/data
    profiles:
      - dev
    networks:
      - default
