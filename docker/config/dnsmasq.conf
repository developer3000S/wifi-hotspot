# dnsmasq Configuration
# Generated for WiFi Hotspot Docker container

# Disable DNS resolution from /etc/resolv.conf
no-resolv

# Upstream DNS servers
server=8.8.8.8
server=8.8.4.4
server=208.67.222.222
server=208.67.220.220

# Local domain resolution
address=/hotspot.example.com/10.10.10.1
address=/localhost/127.0.0.1

# DHCP Configuration
dhcp-range=10.10.10.0,10.10.10.1,255.255.255.0,12h
dhcp-range=10.10.10.100,10.10.10.200,255.255.255.0,24h

# DHCP Options
dhcp-option=option:router,10.10.10.1
dhcp-option=option:dns-server,10.10.10.1,8.8.8.8
dhcp-option=option:ntp-server,10.10.10.1

# Interface to listen on
interface=wlan0

# Don't forward requests to upstream servers for these domains
local=/hotspot.example.com/

# Logging
dhcp-leasefile=/var/lib/misc/dnsmasq.leases
log-dhcp
log-queries
log-facility=/var/log/dnsmasq.log

# Security
port=53
bind-interfaces
