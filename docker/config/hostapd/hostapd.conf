# hostapd Configuration
# Generated for WiFi Hotspot Docker container

# Interface and driver
interface=wlan0
driver=nl80211

# Network configuration
ssid=MME Captive Portal
hw_mode=g
channel=1
macaddr_acl=0
auth_algs=1
ignore_broadcast_ssid=0

# Security configuration
wpa=2
wpa_passphrase=HotspotPassword
wpa_key_mgmt=WPA-PSK
wpa_pairwise=TKIP
rsn_pairwise=CCMP

# Advanced settings
eap_user_file=/etc/hostapd/hostapd.eap_user
eap_sim_db_file=/etc/hostapd/hostapd.eap_sim

# Logging
logger_syslog=-1
logger_syslog_level=2
logger_stdout=-1
logger_stdout_level=2

# Country code (adjust as needed)
country_code=US
